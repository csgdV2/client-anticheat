name: ForceClientAnticheat
version: ${project.version}
main: dev.aegisac.force.ForceAegisAC
api-version: '1.21'
author: csgd
website: https://clientanticheat.netlify.app
description: Kicks players who join without the Client Anticheat client mod.

commands:
  forceclientanticheat:
    description: Manage the Force Client Anticheat plugin.
    usage: /forceclientanticheat reload
    aliases: [fcac, forceaegisac, faac]
    permission: forceclientanticheat.admin

permissions:
  forceclientanticheat.bypass:
    description: Exempts a player from the client handshake requirement.
    default: false
  forceclientanticheat.admin:
    description: Allows reloading the server plugin config.
    default: op
  forceaegisac.bypass:
    description: Legacy alias for forceclientanticheat.bypass.
    default: false
    children:
      forceclientanticheat.bypass: true
  forceaegisac.admin:
    description: Legacy alias for forceclientanticheat.admin.
    default: op
    children:
      forceclientanticheat.admin: true
