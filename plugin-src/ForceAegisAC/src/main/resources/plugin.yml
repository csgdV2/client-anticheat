name: ForceClientAnticheat
version: ${project.version}
main: dev.aegisac.force.ForceAegisAC
api-version: '1.21'
author: csgd
website: https://clientanticheat.netlify.app
description: Kicks players who join without the Client Anticheat client mod.

commands:
  forceaegisac:
    description: Manage the Force Client Anticheat plugin.
    usage: /forceaegisac reload
    aliases: [faac]
    permission: forceaegisac.admin

permissions:
  forceaegisac.bypass:
    description: Players with this permission are never kicked for missing the mod.
    default: false
  forceaegisac.admin:
    description: Allows reloading the plugin config.
    default: op
