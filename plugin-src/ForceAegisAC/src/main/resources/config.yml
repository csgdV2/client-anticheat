# Force Client Anticheat configuration.

# How long (seconds) to wait after a player joins for their client to send the
# Client Anticheat handshake before kicking them. The mod sends it within a tick or two of
# joining; a couple of seconds covers a slow connection without a noticeable delay.
grace-period-seconds: 5

# Message shown to players who are kicked for not running Client Anticheat.
# Supports '&' colour codes and \n for new lines.
kick-message: "&c&lClient Anticheat update required\n\n&7Install &fClient Anticheat 2.1&7 to join.\n&bhttps://clientanticheat.netlify.app"

# Log a line to the console whenever a player passes or fails the check.
log-checks: true
